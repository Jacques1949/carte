<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste de course</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --panel: #fffdf8;
      --text: #2f2a24;
      --muted: #6c6258;
      --accent: #d96c3f;
      --accent-dark: #b6532b;
      --line: #e8dfd4;
      --ok: #5f8b4c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #fff7ec 0, #fff7ec 18%, transparent 18%),
        linear-gradient(180deg, #f8f1e8 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      margin-bottom: 24px;
      padding: 28px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fff4df, #ffe8d3);
      box-shadow: 0 16px 30px rgba(124, 79, 46, 0.12);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 24px rgba(53, 41, 30, 0.07);
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8cec3;
      border-radius: 12px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
    }

    .primary-btn:hover {
      background: var(--accent-dark);
    }

    .secondary-btn {
      background: #efe5da;
      color: var(--text);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      padding: 14px;
      border-radius: 16px;
      background: #fbf6ef;
      border: 1px solid var(--line);
    }

    .summary-card strong {
      display: block;
      font-size: 1.4rem;
      margin-top: 6px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
    }

    .item.done {
      background: #f5fbf2;
    }

    .item.done .item-name,
    .item.done .item-meta {
      text-decoration: line-through;
      color: #7d8578;
    }

    .item-name {
      font-weight: bold;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .item input[type="checkbox"] {
      appearance: auto;
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--ok);
      cursor: pointer;
    }

    .icon-btn {
      padding: 10px 12px;
      background: #f4ece3;
      color: var(--text);
    }

    .delete-btn {
      background: #f8dfd8;
      color: #8b3926;
    }

    .empty {
      padding: 24px;
      text-align: center;
      border: 1px dashed #d9cdbf;
      border-radius: 18px;
      color: var(--muted);
      background: #fffaf3;
    }

    .footer-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .category-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .helper-text {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .category-remove-btn {
      margin-top: 10px;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .item {
        grid-template-columns: 1fr;
      }

      .item-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
        <!-- // La section "hero" en haut de la page présente le titre et une description
          de l'application de liste de course, pour expliquer à l'utilisateur l'objectif
           de l'application et comment elle fonctionne.-->
      <h1>Ma liste de course</h1>
      <p>Ajoute tes articles, coche ce qui est déjà pris, et retrouve ta liste quand tu rouvres la page.</p>
    </section>

    <div class="layout">
        <!-- // La section "layout" organise le contenu principal de la page en deux panneaux côte à côte
        // grâce à CSS Grid. Le premier panneau contient le formulaire pour ajouter des articles,
        // et le second panneau affiche la liste des articles ajoutés, ainsi que les compteurs
        // d'articles total et restant. -->
      <section class="panel">
        <h2>Ajouter un article</h2>
        <!-- // Le formulaire permet à l'utilisateur d'ajouter un nouvel article à la liste de course -->
        <form id="shoppingForm" class="form-grid">
            <!-- // Les champs du formulaire permettent à l'utilisateur de saisir les détails de l'article à ajouter  -->
          <div>
            <label for="itemName">Nom</label>
            <!-- // Le label associe un texte à l'input pour améliorer l'accessibilité -->
            <input id="itemName" type="text" placeholder="Ex : Pommes" required />
            <!-- // L'input permet à l'utilisateur de saisir le nom de l'article -->
          </div>

          <div>
            <label for="itemQuantity">Quantité</label>
            <input id="itemQuantity" type="text" placeholder="Ex : 6 ou 1 kg" />
          </div>

          <div>
            <label for="itemCategory">Catégorie</label>
            <select id="itemCategory"></select>
            <button id="removeCategoryBtn" type="button" class="secondary-btn category-remove-btn">Supprimer</button>
          </div>

          <div>
            <label for="newCategory">Nouvelle catégorie</label>
            <div class="category-row">
              <input id="newCategory" type="text" placeholder="Ex : Surgelés" />
              <button id="addCategoryBtn" type="button" class="secondary-btn">Ajouter</button>
            </div>
            <p class="helper-text">Les catégories ajoutées restent enregistrées sur cet appareil.</p>
          </div>

          <button type="submit" class="primary-btn">Ajouter à la liste</button>
        </form>
      </section>

      <section class="panel">
        <h2>Ma liste</h2>

        <div class="summary">
          <div class="summary-card">
            Articles
            <strong id="totalItems">0</strong>
          </div>

          <div class="summary-card">
            Restants
            <strong id="remainingItems">0</strong>
          </div>
        </div>

        <div id="shoppingList" class="list"></div>

        <div class="footer-actions">
          <button id="clearDoneBtn" type="button" class="secondary-btn">Supprimer les cochés</button>
          <button id="clearAllBtn" type="button" class="secondary-btn">Vider la liste</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const storageKey = "liste-courses";
    const categoriesKey = "liste-categories";
    const defaultCategories = [
      "Fruits et légumes",
      "Produits frais",
      "Épicerie",
      "Boissons",
      "Maison",
      "Autre"
    ];
    const form = document.getElementById("shoppingForm");
    const itemNameInput = document.getElementById("itemName");
    const itemQuantityInput = document.getElementById("itemQuantity");
    const itemCategoryInput = document.getElementById("itemCategory");
    const newCategoryInput = document.getElementById("newCategory");
    const addCategoryBtn = document.getElementById("addCategoryBtn");
    const removeCategoryBtn = document.getElementById("removeCategoryBtn");
    const shoppingList = document.getElementById("shoppingList");
    const totalItems = document.getElementById("totalItems");
    const remainingItems = document.getElementById("remainingItems");
    const clearDoneBtn = document.getElementById("clearDoneBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");

    let items = chargerListe();
    let categories = chargerCategories();

    function chargerListe() {
      const savedItems = localStorage.getItem(storageKey);

      if (!savedItems) {
        return [];
      }

      try {
        return JSON.parse(savedItems);
      } catch (error) {
        return [];
      }
    }

    function sauvegarderListe() {
    // On convertit le tableau d'articles en une chaîne JSON pour le stocker dans localStorage
      localStorage.setItem(storageKey, JSON.stringify(items));
    }

    function chargerCategories() {
      const savedCategories = localStorage.getItem(categoriesKey);

      if (!savedCategories) {
        return [...defaultCategories];
      }

      try {
        const parsedCategories = JSON.parse(savedCategories);
        return Array.isArray(parsedCategories) && parsedCategories.length > 0
          ? parsedCategories
          : [...defaultCategories];
      } catch (error) {
        return [...defaultCategories];
      }
    }

    function sauvegarderCategories() {
      localStorage.setItem(categoriesKey, JSON.stringify(categories));
    }

    function afficherCategories(selectedCategory = itemCategoryInput.value) {
      categories.sort((a, b) => a.localeCompare(b, "fr", { sensitivity: "base" }));
      itemCategoryInput.innerHTML = "";

      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        itemCategoryInput.appendChild(option);
      });

      if (categories.includes(selectedCategory)) {
        itemCategoryInput.value = selectedCategory;
      } else if (categories.length > 0) {
        itemCategoryInput.value = categories[0];
      }

      mettreAJourBoutonSuppressionCategorie();
    }

    function mettreAJourBoutonSuppressionCategorie() {
      const selectedCategory = itemCategoryInput.value;

      if (!selectedCategory) {
        removeCategoryBtn.textContent = "Supprimer";
        return;
      }

      removeCategoryBtn.textContent = `Supprimer : ${selectedCategory}`;
    }

    function ajouterCategorie() {
      const newCategory = newCategoryInput.value.trim();

      if (!newCategory) {
        return;
      }

      const existingCategory = categories.find(
        (category) => category.toLowerCase() === newCategory.toLowerCase()
      );

      if (existingCategory) {
        itemCategoryInput.value = existingCategory;
        newCategoryInput.value = "";
        return;
      }

      categories.push(newCategory);
      categories.sort((a, b) => a.localeCompare(b, "fr", { sensitivity: "base" }));
      sauvegarderCategories();
      afficherCategories(newCategory);
      newCategoryInput.value = "";
      newCategoryInput.focus();
    }

    function supprimerCategorieSelectionnee() {
      const selectedCategory = itemCategoryInput.value;

      if (!selectedCategory || categories.length === 1) {
        return;
      }

      categories = categories.filter((category) => category !== selectedCategory);
      items = items.map((item) => {
        if (item.category === selectedCategory) {
          return {
            ...item,
            category: categories[0]
          };
        }

        return item;
      });

      sauvegarderCategories();
      sauvegarderListe();
      afficherCategories(categories[0]);
      afficherListe();
    }

    function afficherListe() {
        // On vide d’abord l’affichage actuel de la liste pour éviter les doublons
      shoppingList.innerHTML = "";
        // On met à jour les compteurs d’articles total et restant
      totalItems.textContent = items.length;
      // On compte le nombre d’articles qui ne sont pas cochés (done = false) pour le compteur de restants
      remainingItems.textContent = items.filter((item) => !item.done).length;

      if (items.length === 0) {
        // Si la liste est vide, on affiche un message indiquant que la liste est vide
        shoppingList.innerHTML = '<div class="empty">Ta liste est vide pour le moment.</div>';
        return;
      }

      items.forEach((item) => {
        const article = document.createElement("div");
        article.className = item.done ? "item done" : "item";

        article.innerHTML = `
          <input type="checkbox" ${item.done ? "checked" : ""} aria-label="Marquer ${item.name} comme acheté" />
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-meta">${item.quantity || "Quantité libre"} • ${item.category}</div>
          </div>
          <div class="item-actions">
            <button type="button" class="icon-btn">Modifier</button>
            <button type="button" class="icon-btn delete-btn">Supprimer</button>
          </div>
        `;

        const checkbox = article.querySelector('input[type="checkbox"]');
        const editButton = article.querySelector(".icon-btn");
        const deleteButton = article.querySelector(".delete-btn");

        checkbox.addEventListener("change", () => {
          item.done = checkbox.checked;
          sauvegarderListe();
          afficherListe();
        });

        editButton.addEventListener("click", () => {
          const nouveauNom = prompt("Nom de l'article :", item.name);

          if (!nouveauNom) {
            return;
          }

          const nouvelleQuantite = prompt("Quantité :", item.quantity);
          item.name = nouveauNom.trim();
          item.quantity = nouvelleQuantite ? nouvelleQuantite.trim() : "";
          sauvegarderListe();
          afficherListe();
        });

        deleteButton.addEventListener("click", () => {
          items = items.filter((currentItem) => currentItem.id !== item.id);
          sauvegarderListe();
          afficherListe();
        });

        shoppingList.appendChild(article);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = itemNameInput.value.trim();

      if (!name) {
        return;
      }

      items.push({
        id: crypto.randomUUID(),
        name: name,
        quantity: itemQuantityInput.value.trim(),
        category: itemCategoryInput.value,
        done: false
      });

      sauvegarderListe();
      afficherListe();
      form.reset();
      afficherCategories(defaultCategories[0]);
      itemNameInput.focus();
    });

    addCategoryBtn.addEventListener("click", () => {
      ajouterCategorie();
    });

    removeCategoryBtn.addEventListener("click", () => {
      supprimerCategorieSelectionnee();
    });

    newCategoryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        ajouterCategorie();
      }
    });

    itemCategoryInput.addEventListener("change", () => {
      mettreAJourBoutonSuppressionCategorie();
    });

    clearDoneBtn.addEventListener("click", () => {
      items = items.filter((item) => !item.done);
      sauvegarderListe();
      afficherListe();
    });

    clearAllBtn.addEventListener("click", () => {
      items = [];
      sauvegarderListe();
      afficherListe();
    });

    afficherCategories(categories[0]);
    afficherListe();
  </script>
</body>
</html>
